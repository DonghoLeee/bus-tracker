server:
  port: 8080

spring:
  application:
    name: bus-tracker
  datasource:
    url: jdbc:h2:mem:busdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

bus:
  provider: mock
  public-api:
    service-key: ""
    endpoint: "http://apis.data.go.kr/1613000/ArvlInfoInqireService"
