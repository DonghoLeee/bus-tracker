name: CI/CD Pipeline - Docker Deploy to GCP

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정 (build.gradle의 Java 21 설정과 일치)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 빌드 (backend 디렉터리 기준)
      - name: Build with Gradle
        working-directory: ./backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test --no-daemon

      # 4. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 백엔드 Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bus-tracker-backend:latest

      # 6. 프론트엔드 Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bus-tracker-frontend:latest

      # 7. GCP 서버에 SSH 접속 후 배포
      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            # 기존 컨테이너 전부 중지 (구 서비스명 app 포함)
            sudo docker compose down --remove-orphans 2>/dev/null || true
            sudo docker stop bus-tracker-app bus-tracker-backend bus-tracker-frontend 2>/dev/null || true
            sudo docker rm bus-tracker-app bus-tracker-backend bus-tracker-frontend 2>/dev/null || true

            # docker-compose.yml 작성 (들여쓰기 없는 heredoc)
            cat > docker-compose.yml << EOF
version: '3.8'

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/bus-tracker-backend:latest
    container_name: bus-tracker-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  frontend:
    image: ${DOCKERHUB_USERNAME}/bus-tracker-frontend:latest
    container_name: bus-tracker-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
EOF

            # 최신 이미지 다운로드
            sudo docker compose pull || docker compose pull

            # 컨테이너 실행
            sudo docker compose up -d || docker compose up -d

            # 미사용 이미지 정리
            sudo docker image prune -f || docker image prune -f

            # 상태 확인
            echo "=== 실행 중인 컨테이너 ==="
            sudo docker compose ps
